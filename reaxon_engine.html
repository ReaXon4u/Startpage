<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Xon Search</title>
  <style>

    .logo {
  width: 90px;
  height: 90px;
  border-radius: 18px;
  background: none;
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
  overflow: hidden;
}

.logo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 18px;
}

    :root{--bg:#0f1724;--card:#0b1220;--accent:#8b5cf6;--muted:#9aa4b2;--glass:rgba(255,255,255,0.04)}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial}
    body{background: radial-gradient(1200px 600px at 10% 10%, rgba(139,92,246,0.12), transparent), linear-gradient(180deg,#041024 0%, #071223 100%); color:#e6eef8;display:flex;align-items:center;justify-content:center}

    .card{width: min(920px,94vw); padding:36px;border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(2,6,23,0.6)}

    .brand{display:flex;gap:16px;align-items:center;margin-bottom:22px}
    .logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(92,51,163,0.25), inset 0 -6px 18px rgba(255,255,255,0.06)}
    .logo svg{width:46px;height:46px;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.35))}
    .title{line-height:1}
    .title h1{margin:0;font-size:20px;letter-spacing:-0.2px}
    .title p{margin:0;color:var(--muted);font-size:13px}

    .search-row{display:flex;gap:12px;align-items:center}
    .search-input{flex:1;display:flex;align-items:center;background:var(--glass);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
    .search-input input{flex:1;background:transparent;border:0;outline:none;color:inherit;font-size:16px;padding:6px}
    .icon-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:8px;border-radius:10px}

    .controls{display:flex;gap:10px;align-items:center;margin-top:14px}
    select{background:transparent;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);color:inherit}
    .actions{margin-left:auto;display:flex;gap:8px}
    .btn{padding:9px 14px;border-radius:9px;border:0;background:linear-gradient(90deg,var(--accent),#06b6d4);color:#021026;font-weight:600;cursor:pointer}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted)}

    .suggestions{margin-top:14px;background:transparent;border-radius:10px;padding:8px;display:grid;gap:6px}
    .sugg{padding:10px;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--muted);font-size:14px;cursor:pointer}
    .sugg:hover{background:rgba(255,255,255,0.03);color:#fff}

    .footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:right}

    .quick-links {
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:20px;
      font-size:26px;
    }
    .quick-links a {
      text-decoration:none;
      transition: transform 0.2s, filter 0.2s;
    }
    .quick-links a img {
      width:28px;
      height:28px;
      border-radius:6px;
    }
    .quick-links a:hover {
      transform: scale(1.2);
      filter: drop-shadow(0 0 8px var(--accent));
    }

    @media (max-width:520px){.card{padding:18px}.logo{width:56px;height:56px}}

#themeBtn {
  background: linear-gradient(90deg, #8b5cf6, #06b6d4);
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-weight: 600;
  cursor: pointer;
  color: #021026;
  transition: 0.3s ease;
}

#themeBtn:hover {
  transform: scale(1.05);
  filter: drop-shadow(0 0 8px var(--accent));
}
#colorPicker {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 50%;
  overflow: hidden;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0,0,0,0.4);
  background: transparent;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  z-index: 999;
}

#colorPicker:hover {
  transform: scale(1.15);
  box-shadow: 0 0 15px rgba(255,255,255,0.6);
}

  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="logo" aria-hidden>
  <img src="cat.png" alt="Reaxon Logo" class="logo-img">
</div>

      <div class="title">
        <h1>Xon Search</h1>
        <p>Your chill, fast-search buddy — results delivered in a vibe.</p>
      </div>
    </div>

    <div class="search-row">
      <div class="search-input" role="search">
        <input id="q" type="search" autocomplete="off" placeholder="Search the cosmos..." aria-label="Search query" />
        <button class="icon-btn" id="clearBtn" title="Clear" aria-label="Clear search">✕</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="engineSelect" title="Choose search engine">
          <option value="https://www.google.com/search?q=">Google</option>
          <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
          <option value="https://www.bing.com/search?q=">Bing</option>
        </select>
        <button class="btn" id="searchBtn">Search</button>
      </div>
    </div>

    <div class="quick-links">
      <a href="https://www.youtube.com" target="_blank" title="YouTube"><img src="https://www.google.com/s2/favicons?sz=64&domain=youtube.com" alt="YouTube"></a>
      <a href="https://x.com" target="_blank" title="X (Twitter)"><img src="https://www.google.com/s2/favicons?sz=64&domain=x.com" alt="X"></a>
      <a href="https://discord.com/channels/@me" target="_blank" title="Discord"><img src="https://www.google.com/s2/favicons?sz=64&domain=discord.com" alt="Discord"></a>
      <a href="https://www.instagram.com" target="_blank" title="Instagram"><img src="https://www.google.com/s2/favicons?sz=64&domain=instagram.com" alt="Instagram"></a>
      <a href="https://www.reddit.com" target="_blank" title="Reddit"><img src="https://www.google.com/s2/favicons?sz=64&domain=reddit.com" alt="Reddit"></a>
      <a href="https://github.com" target="_blank" title="GitHub"><img src="https://www.google.com/s2/favicons?sz=64&domain=github.com" alt="GitHub"></a>
      <a href="https://open.spotify.com" target="_blank" title="Spotify"><img src="https://www.google.com/s2/favicons?sz=64&domain=spotify.com" alt="Spotify"></a>
      <a href="https://www.wikipedia.org" target="_blank" title="Wikipedia"><img src="https://www.google.com/s2/favicons?sz=64&domain=wikipedia.org" alt="Wikipedia"></a>
    </div>

    <div class="controls">
      <div style="display:flex;gap:8px;align-items:center">
        <label style="color:var(--muted);font-size:13px">Quick picks</label>
        <div style="display:flex;gap:6px">
          <button class="ghost btn" id="trendingBtn">Trending</button>
          <button class="ghost btn" id="imagesBtn">Images</button>
        </div>
      </div>
      <div class="actions">
        <button class="ghost btn" id="luckyBtn">I'm Feeling Lucky</button>
      </div>
    </div>

    <div class="suggestions" id="suggestions" aria-hidden></div>
<div style="text-align:center; margin-top:20px;">
  <button class="btn" id="themeBtn">Change Vibe 🌈</button>
</div>
    <div class="footer">© Copyright <strong>ReaXon</strong> 2025 • Version 1.15 Made With ❤️</div>
  </main>

  <script>
    const q = document.getElementById('q');
    const searchBtn = document.getElementById('searchBtn');
    const engineSelect = document.getElementById('engineSelect');
    const suggestionsEl = document.getElementById('suggestions');
    const clearBtn = document.getElementById('clearBtn');
    const luckyBtn = document.getElementById('luckyBtn');

const sampleSuggestions = [
  { text: 'Who Made This Engine?', url: 'https://github.com/reaxon4u' },
  'Cat Images',
  'Reaxon engine tips and tricks',
  'Latest tech news',
  'Saturn images',
  'Best coffee near me',
  'Coding projects for beginners'
];

function renderSuggestions(filter = '') {
  suggestionsEl.innerHTML = '';
  const list = sampleSuggestions
    .filter(s => {
      const text = typeof s === 'string' ? s : s.text;
      return text.toLowerCase().includes(filter.toLowerCase());
    })
    .slice(0, 6);

  list.forEach(s => {
    const el = document.createElement('div');
    el.className = 'sugg';

    if (typeof s === 'object' && s.url) {
      el.innerHTML = `<a href="${s.url}" target="_blank" style="color:inherit;text-decoration:none;">${s.text}</a>`;
    } else {
      el.textContent = s;
      el.addEventListener('click', () => { q.value = s; doSearch(); });
    }

    suggestionsEl.appendChild(el);
  });

  suggestionsEl.style.display = list.length ? 'block' : 'none';
}
	
    q.addEventListener('input', e => renderSuggestions(e.target.value));
    clearBtn.addEventListener('click', ()=>{ q.value=''; q.focus(); renderSuggestions(''); });

function doSearch(){
  const query = q.value.trim();
  if(!query) return;
  const base = engineSelect.value;
  const url = base + encodeURIComponent(query);
  window.location.href = url; // opens in the same page
}

    function doLucky(){
      const query = q.value.trim() || sampleSuggestions[Math.floor(Math.random()*sampleSuggestions.length)];
      const engine = engineSelect.value;
      if(engine.includes('google')){
        const url = 'https://www.google.com/search?q=' + encodeURIComponent(query) + '&btnI=I';
        window.open(url, '_blank');
      } else {
        doSearch();
      }
    }

    searchBtn.addEventListener('click', doSearch);
    luckyBtn.addEventListener('click', doLucky);
    q.addEventListener('keydown', e => { if(e.key === 'Enter') doSearch(); if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){ const idx = engineSelect.selectedIndex; if(e.key === 'ArrowUp') engineSelect.selectedIndex = Math.max(0, idx-1); else engineSelect.selectedIndex = Math.min(engineSelect.options.length-1, idx+1); }});

    document.getElementById('trendingBtn').addEventListener('click', ()=>{ const base = engineSelect.value; window.open(base + encodeURIComponent('trending news'), '_blank'); });
    document.getElementById('imagesBtn').addEventListener('click', ()=>{ const qstr = 'beautiful wallpapers'; const engine = engineSelect.value; if(engine.includes('duckduckgo')) window.open('https://duckduckgo.com/?q=' + encodeURIComponent(qstr) + '&iax=images&ia=images','_blank'); else if(engine.includes('google')) window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(qstr),'_blank'); else window.open(engine + encodeURIComponent(qstr),'_blank'); });

    renderSuggestions();
    window.addEventListener('keydown', e=>{ if(e.shiftKey && e.key.toLowerCase()==='r'){ document.body.style.background = document.body.style.background ? '' : 'linear-gradient(90deg,#0f1724,#071233 40%,#2b0033)'; }});

const themeBtn = document.getElementById('themeBtn');
let darkMode = true;

themeBtn.addEventListener('click', () => {
  const root = document.documentElement;

  if (darkMode) {
    // 🌞 Light mode
    root.style.setProperty('--bg', '#f7f8fa');
    root.style.setProperty('--card', '#ffffff');
    root.style.setProperty('--accent', '#2563eb');
    root.style.setProperty('--muted', '#333');
    root.style.setProperty('--glass', 'rgba(0,0,0,0.04)');
    document.body.style.background = 'linear-gradient(180deg,#e5eeff 0%, #c9e4ff 100%)';
    document.body.style.color = '#111';
    themeBtn.textContent = 'Change Vibe 🌙';
  } else {
    // 🌌 Dark mode
    root.style.setProperty('--bg', '#0f1724');
    root.style.setProperty('--card', '#0b1220');
    root.style.setProperty('--accent', '#8b5cf6');
    root.style.setProperty('--muted', '#9aa4b2');
    root.style.setProperty('--glass', 'rgba(255,255,255,0.04)');
    document.body.style.background = 'radial-gradient(1200px 600px at 10% 10%, rgba(139,92,246,0.12), transparent), linear-gradient(180deg,#041024 0%, #071223 100%)';
    document.body.style.color = '#e6eef8';
    themeBtn.textContent = 'Change Vibe 🌈';
  }

  darkMode = !darkMode;
});
  </script>
</body>
</html>
