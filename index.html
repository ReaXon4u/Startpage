<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" type="image/png" href="Caticon.jpg">
  <title>ReaSearch</title>
  <style>

    .logo {
  width: 90px;
  height: 90px;
  border-radius: 18px;
  background: none;
  box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
  overflow: hidden;
}

.logo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 18px;
}

    :root{--bg:#0f1724;--card:#0b1220;--accent:#8b5cf6;--muted:#9aa4b2;--glass:rgba(255,255,255,0.04);--accent2:#06b6d4}
    *{box-sizing:border-box;transition:background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease}
    html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial}
    body{background: radial-gradient(1200px 600px at 10% 10%, rgba(139,92,246,0.12), transparent), linear-gradient(180deg,#041024 0%, #071223 100%); color:#e6eef8;display:flex;align-items:center;justify-content:center;transition:background 0.5s ease, color 0.3s ease, background-image 0.5s ease;position:relative}
    
    /* Beyblade background overlay with custom image */
    .beyblade-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.6s ease;
      overflow: hidden;
      background-image: url('skn.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      filter: brightness(0.7);
    }
    
    .beyblade-overlay.active {
      opacity: 0.4;
    }
    
    body.beyblade-mode {
      background: linear-gradient(135deg, 
        rgba(127, 29, 29, 0.8) 0%, 
        rgba(0, 0, 0, 0.9) 25%,
        rgba(185, 28, 28, 0.7) 50%,
        rgba(0, 0, 0, 0.95) 75%,
        rgba(127, 29, 29, 0.8) 100%);
      background-size: 200% 200%;
      animation: gradientShift 8s ease infinite;
    }
    
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    body.beyblade-mode .card {
      box-shadow: 0 10px 40px rgba(220, 38, 38, 0.5), 
                  0 0 80px rgba(185, 28, 28, 0.3),
                  inset 0 0 20px rgba(127, 29, 29, 0.2);
      border: 1px solid rgba(220, 38, 38, 0.3);
    }
    
    /* Easter Egg Pop-up Notification */
    .easter-egg-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: linear-gradient(135deg, rgba(220, 38, 38, 0.95), rgba(185, 28, 28, 0.95));
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 20px;
      padding: 30px 40px;
      color: #fff;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(220, 38, 38, 0.6),
                  inset 0 0 20px rgba(255, 255, 255, 0.1);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      backdrop-filter: blur(10px);
      cursor: pointer;
      user-select: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    
    .easter-egg-popup.show {
      animation: popupShow 0.5s ease forwards, popupPulse 2s ease 0.5s infinite;
      pointer-events: auto;
    }
    
    .easter-egg-popup:hover {
      transform: translate(-50%, -50%) scale(1.05);
    }
    
    .easter-egg-popup.show {
      opacity: 1;
      pointer-events: auto;
    }
    
    @keyframes popupShow {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.5) rotate(-10deg);
      }
      50% {
        transform: translate(-50%, -50%) scale(1.1) rotate(5deg);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1) rotate(0deg);
      }
    }
    
    @keyframes popupPulse {
      0%, 100% {
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                    0 0 40px rgba(220, 38, 38, 0.6),
                    inset 0 0 20px rgba(255, 255, 255, 0.1);
      }
      50% {
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                    0 0 60px rgba(220, 38, 38, 0.9),
                    inset 0 0 30px rgba(255, 255, 255, 0.2);
      }
    }
    
    .easter-egg-popup::before {
      content: '🎯';
      display: block;
      font-size: 48px;
      margin-bottom: 10px;
      animation: spin 3s linear infinite;
    }
    
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .card{width: min(920px,94vw); padding:36px;border-radius:18px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(2,6,23,0.6);transition:background 0.5s ease, box-shadow 0.5s ease;position:relative;z-index:1}

    .brand{display:flex;gap:16px;align-items:center;margin-bottom:22px}
    .logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#7c3aed,#06b6d4);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(92,51,163,0.25), inset 0 -6px 18px rgba(255,255,255,0.06)}
    .logo svg{width:46px;height:46px;filter:drop-shadow(0 6px 10px rgba(0,0,0,0.35))}
    .title{line-height:1}
    .title h1{margin:0;font-size:20px;letter-spacing:-0.2px}
    .title p{margin:0;color:var(--muted);font-size:13px}

    .search-row{display:flex;gap:12px;align-items:center}
    .search-input{flex:1;display:flex;align-items:center;background:var(--glass);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03);transition:border-color 0.3s ease, background 0.3s ease}
    .search-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(139,92,246,0.1)}
    .search-input input{flex:1;background:transparent;border:0;outline:none;color:inherit;font-size:16px;padding:6px}
    .icon-btn{background:transparent;border:0;color:var(--muted);cursor:pointer;padding:8px;border-radius:10px;transition:color 0.2s ease, background 0.2s ease}
    .icon-btn:hover{color:var(--accent);background:rgba(255,255,255,0.05)}

    .controls{display:flex;gap:10px;align-items:center;margin-top:14px}
    select{background:transparent;padding:8px;border-radius:10px;border:1px solid rgba(255,255,255,0.03);color:inherit;cursor:pointer;transition:border-color 0.2s ease}
    select:hover,select:focus{border-color:var(--accent);outline:none}
    .actions{margin-left:auto;display:flex;gap:8px}
    .btn{padding:9px 14px;border-radius:9px;border:0;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#021026;font-weight:600;cursor:pointer;transition:transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease}
    .btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
    .btn:active{transform:translateY(0)}
    .ghost{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);transition:border-color 0.2s ease, background 0.2s ease, color 0.2s ease}
    .ghost:hover{background:rgba(255,255,255,0.05);border-color:var(--accent);color:var(--accent)}

    .suggestions{margin-top:14px;background:transparent;border-radius:10px;padding:8px;display:grid;gap:6px}
    .sugg{padding:10px;border-radius:8px;background:rgba(255,255,255,0.02);color:var(--muted);font-size:14px;cursor:pointer;transition:background 0.2s ease, color 0.2s ease, transform 0.2s ease}
    .sugg:hover{background:rgba(255,255,255,0.08);color:var(--accent);transform:translateX(4px)}

    .footer{margin-top:18px;color:var(--muted);font-size:13px;text-align:right}

    .quick-links {
      display:flex;
      justify-content:center;
      gap:20px;
      margin-top:20px;
      font-size:26px;
    }
    .quick-links a {
      text-decoration:none;
      transition: transform 0.2s, filter 0.2s;
    }
    .quick-links a img {
      width:28px;
      height:28px;
      border-radius:6px;
    }
    .quick-links a:hover {
      transform: scale(1.2);
      filter: drop-shadow(0 0 8px var(--accent));
    }

    @media (max-width:520px){
      .card{padding:18px}
      .logo{width:56px;height:56px}
      .theme-dropdown{grid-template-columns: repeat(2, 1fr); min-width: 200px}
      .search-row{flex-direction:column;gap:10px}
      .search-row > div{width:100%}
      .search-row select{width:100%}
    }
    
    kbd {
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      font-family: monospace;
      color: var(--accent);
    }
    
    /* Animated background particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    
    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.1;
      animation: float 20s infinite ease-in-out;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(100px, -100px) scale(1.2); }
      50% { transform: translate(-50px, 100px) scale(0.8); }
      75% { transform: translate(-100px, -50px) scale(1.1); }
    }
    
    /* Time-based greeting */
    .greeting {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeInUp 0.6s ease 0.2s forwards;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Search history */
    .search-history {
      margin-top: 12px;
      padding: 8px;
      border-radius: 10px;
      background: transparent;
      display: none;
    }
    
    .search-history.show {
      display: block;
    }
    
    .history-title {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .history-item {
      padding: 8px;
      border-radius: 6px;
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
    }
    
    .history-item:hover {
      background: rgba(255,255,255,0.05);
      color: var(--accent);
      transform: translateX(4px);
    }
    
    .history-item .delete-btn {
      opacity: 0;
      transition: opacity 0.2s ease;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }
    
    .history-item:hover .delete-btn {
      opacity: 1;
    }
    
    .history-item .delete-btn:hover {
      color: #ef4444;
      background: rgba(239,68,68,0.1);
    }
    
    /* Loading animation */
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Card entrance animation */
    .card {
      animation: cardEntrance 0.6s ease-out;
    }
    
    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    
    /* Pulse animation for logo */
    .logo {
      animation: logoPulse 3s ease-in-out infinite;
    }
    
    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 0 12px rgba(139, 92, 246, 0.4); }
      50% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.6); }
    }

.theme-selector {
  position: relative;
  display: inline-block;
  margin-top: 20px;
}

#themeBtn {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-weight: 600;
  cursor: pointer;
  color: #021026;
  transition: transform 0.2s ease, filter 0.2s ease;
  display: flex;
  align-items: center;
  gap: 8px;
}

#themeBtn:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

.theme-dropdown {
  position: absolute;
  top: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 8px;
  display: none;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  min-width: 280px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  backdrop-filter: blur(10px);
  z-index: 1000;
  animation: fadeIn 0.2s ease;
}

.theme-dropdown.show {
  display: grid;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

.theme-option {
  aspect-ratio: 1;
  border-radius: 8px;
  border: 2px solid transparent;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s ease, border-color 0.2s ease;
}

.theme-option:hover {
  transform: scale(1.1);
  border-color: var(--accent);
}

.theme-option.active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent);
}

.theme-option::after {
  content: '✓';
  position: absolute;
  top: 4px;
  right: 4px;
  color: white;
  font-weight: bold;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.2s ease;
}

.theme-option.active::after {
  opacity: 1;
}

.theme-label {
  position: absolute;
  bottom: 4px;
  left: 4px;
  right: 4px;
  font-size: 10px;
  color: white;
  text-align: center;
  font-weight: 600;
  text-shadow: 0 1px 2px rgba(0,0,0,0.5);
}

.keyboard-hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
  text-align: center;
}

  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="beyblade-overlay" id="beybladeOverlay"></div>
  <div class="easter-egg-popup" id="easterEggPopup">You Found me :P</div>
  
  <main class="card">
    <div class="brand">
      <div class="logo" aria-hidden>
  <img src="cat.png" alt="Reaxon Logo" class="logo-img">
</div>

      <div class="title">
        <div class="greeting" id="greeting"></div>
        <h1>ReaSearch</h1>
        <p>Your chill, fast-search buddy — results delivered in a vibe.</p>
      </div>
    </div>

    <div class="search-row">
      <div class="search-input" role="search">
        <input id="q" type="search" autocomplete="off" placeholder="Search the cosmos..." aria-label="Search query" />
        <button class="icon-btn" id="clearBtn" title="Clear" aria-label="Clear search">✕</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="engineSelect" title="Choose search engine">
          <option value="https://www.google.com/search?q=">Google</option>
          <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
          <option value="https://www.bing.com/search?q=">Bing</option>
        </select>
        <button class="btn" id="searchBtn">Search</button>
      </div>
    </div>

    <div class="quick-links">
      <a href="https://www.youtube.com" target="_blank" title="YouTube"><img src="https://www.google.com/s2/favicons?sz=64&domain=youtube.com" alt="YouTube"></a>
      <a href="https://x.com" target="_blank" title="X (Twitter)"><img src="https://www.google.com/s2/favicons?sz=64&domain=x.com" alt="X"></a>
      <a href="https://discord.com/channels/@me" target="_blank" title="Discord"><img src="https://www.google.com/s2/favicons?sz=64&domain=discord.com" alt="Discord"></a>
      <a href="https://www.instagram.com" target="_blank" title="Instagram"><img src="https://www.google.com/s2/favicons?sz=64&domain=instagram.com" alt="Instagram"></a>
      <a href="https://www.reddit.com" target="_blank" title="Reddit"><img src="https://www.google.com/s2/favicons?sz=64&domain=reddit.com" alt="Reddit"></a>
      <a href="https://github.com" target="_blank" title="GitHub"><img src="https://www.google.com/s2/favicons?sz=64&domain=github.com" alt="GitHub"></a>
      <a href="https://open.spotify.com" target="_blank" title="Spotify"><img src="https://www.google.com/s2/favicons?sz=64&domain=spotify.com" alt="Spotify"></a>
      <a href="https://www.wikipedia.org" target="_blank" title="Wikipedia"><img src="https://www.google.com/s2/favicons?sz=64&domain=wikipedia.org" alt="Wikipedia"></a>
    </div>

    <div class="controls">
      <div style="display:flex;gap:8px;align-items:center">
        <label style="color:var(--muted);font-size:13px">Quick picks</label>
        <div style="display:flex;gap:6px">
          <button class="ghost btn" id="trendingBtn">Trending</button>
          <button class="ghost btn" id="imagesBtn">Images</button>
        </div>
      </div>
      <div class="actions">
        <button class="ghost btn" id="luckyBtn">I'm Feeling Lucky</button>
      </div>
    </div>

    <div class="suggestions" id="suggestions" aria-hidden></div>
    
    <div class="search-history" id="searchHistory">
      <div class="history-title">
        <span>Recent Searches</span>
        <button class="ghost btn" id="clearHistory" style="padding:4px 8px;font-size:11px">Clear All</button>
      </div>
      <div id="historyList"></div>
    </div>
    
    <div class="theme-selector" style="text-align:center;">
      <button class="btn" id="themeBtn" aria-label="Change theme" aria-expanded="false">
        <span>🎨</span> <span>Change Theme</span>
      </button>
      <div class="theme-dropdown" id="themeDropdown" role="menu" aria-label="Theme options">
        <div class="theme-option active" data-theme="dark" role="menuitem" aria-label="Dark theme" style="background: linear-gradient(135deg, #0f1724, #1e293b);">
          <span class="theme-label">Dark</span>
        </div>
        <div class="theme-option" data-theme="light" role="menuitem" aria-label="Light theme" style="background: linear-gradient(135deg, #f7f8fa, #e5e7eb);">
          <span class="theme-label">Light</span>
        </div>
        <div class="theme-option" data-theme="blue" role="menuitem" aria-label="Blue theme" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6);">
          <span class="theme-label">Blue</span>
        </div>
        <div class="theme-option" data-theme="purple" role="menuitem" aria-label="Purple theme" style="background: linear-gradient(135deg, #6b21a8, #a855f7);">
          <span class="theme-label">Purple</span>
        </div>
        <div class="theme-option" data-theme="green" role="menuitem" aria-label="Green theme" style="background: linear-gradient(135deg, #166534, #22c55e);">
          <span class="theme-label">Green</span>
        </div>
        <div class="theme-option" data-theme="sunset" role="menuitem" aria-label="Sunset theme" style="background: linear-gradient(135deg, #ea580c, #f97316);">
          <span class="theme-label">Sunset</span>
        </div>
        <div class="theme-option" data-theme="ocean" role="menuitem" aria-label="Ocean theme" style="background: linear-gradient(135deg, #0c4a6e, #06b6d4);">
          <span class="theme-label">Ocean</span>
        </div>
        <div class="theme-option" data-theme="forest" role="menuitem" aria-label="Forest theme" style="background: linear-gradient(135deg, #14532d, #16a34a);">
          <span class="theme-label">Forest</span>
        </div>
      </div>
      <div class="keyboard-hint">Press <kbd>Ctrl+K</kbd> to focus search • <kbd>T</kbd> for themes</div>
    </div>
    
    <div class="footer">© Copyright <strong>ReaXon</strong> 2025 • Version 1.16 Made With ❤️</div>
  </main>

  <script>
    // Initialize elements
    const q = document.getElementById('q');
    const searchBtn = document.getElementById('searchBtn');
    const engineSelect = document.getElementById('engineSelect');
    const suggestionsEl = document.getElementById('suggestions');
    const clearBtn = document.getElementById('clearBtn');
    const luckyBtn = document.getElementById('luckyBtn');
    const searchHistory = document.getElementById('searchHistory');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistory');
    const beybladeOverlay = document.getElementById('beybladeOverlay');
    const easterEggPopup = document.getElementById('easterEggPopup');
    
    // Track previous theme for beyblade easter egg
    let previousTheme = localStorage.getItem('reaxon-theme') || 'dark';
    let isBeybladeMode = false;
    let popupShown = false;
    
    // Beyblade mode functions
    function activateBeybladeMode() {
      if (isBeybladeMode) return;
      
      // Save current theme
      previousTheme = localStorage.getItem('reaxon-theme') || 'dark';
      
      // Apply beyblade theme
      applyTheme('beyblade');
      
      // Activate beyblade overlay and body class
      beybladeOverlay.classList.add('active');
      document.body.classList.add('beyblade-mode');
      
      // Show popup message (only once per session)
      if (!popupShown) {
        setTimeout(() => {
          easterEggPopup.classList.add('show');
          popupShown = true;
          
          // Auto-hide popup after 4 seconds
          setTimeout(() => {
            easterEggPopup.classList.remove('show');
          }, 4000);
        }, 300);
      }
      
      isBeybladeMode = true;
    }
    
    function deactivateBeybladeMode() {
      if (!isBeybladeMode) return;
      
      // Revert to previous theme
      applyTheme(previousTheme);
      
      // Remove beyblade overlay and body class
      beybladeOverlay.classList.remove('active');
      document.body.classList.remove('beyblade-mode');
      
      // Hide popup if visible
      easterEggPopup.classList.remove('show');
      
      isBeybladeMode = false;
    }
    
    // Time-based greeting
    function updateGreeting() {
      const hour = new Date().getHours();
      const greetingEl = document.getElementById('greeting');
      let greeting = '';
      
      if (hour < 12) {
        greeting = 'Good Morning! ☀️';
      } else if (hour < 17) {
        greeting = 'Good Afternoon! 🌤️';
      } else if (hour < 21) {
        greeting = 'Good Evening! 🌆';
      } else {
        greeting = 'Good Night! 🌙';
      }
      
      greetingEl.textContent = greeting;
    }
    updateGreeting();
    
    // Animated background particles (will be called after themes are defined)
    function createParticles(themeColor = '#8b5cf6') {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 15;
      
      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const size = Math.random() * 100 + 50;
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.top = Math.random() * 100 + '%';
        particle.style.background = themeColor;
        particle.style.animationDelay = Math.random() * 20 + 's';
        particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
        particlesContainer.appendChild(particle);
      }
    }
    
    // Search history management
    function getSearchHistory() {
      const history = localStorage.getItem('reaxon-search-history');
      return history ? JSON.parse(history) : [];
    }
    
    function saveSearchHistory(history) {
      localStorage.setItem('reaxon-search-history', JSON.stringify(history));
    }
    
    function addToHistory(query) {
      if (!query || query.trim() === '') return;
      
      let history = getSearchHistory();
      // Remove if already exists
      history = history.filter(item => item.toLowerCase() !== query.toLowerCase());
      // Add to beginning
      history.unshift(query);
      // Keep only last 10
      history = history.slice(0, 10);
      saveSearchHistory(history);
      renderHistory();
    }
    
    function renderHistory() {
      const history = getSearchHistory();
      historyList.innerHTML = '';
      
      if (history.length === 0) {
        searchHistory.classList.remove('show');
        return;
      }
      
      searchHistory.classList.add('show');
      
      history.forEach((item, index) => {
        const historyItem = document.createElement('div');
        historyItem.className = 'history-item';
        historyItem.innerHTML = `
          <span onclick="selectHistoryItem('${item.replace(/'/g, "\\'")}')">${item}</span>
          <button class="delete-btn" onclick="deleteHistoryItem(${index})" aria-label="Delete">×</button>
        `;
        historyList.appendChild(historyItem);
      });
    }
    
    window.selectHistoryItem = function(query) {
      q.value = query;
      q.focus();
      doSearch();
    };
    
    window.deleteHistoryItem = function(index) {
      let history = getSearchHistory();
      history.splice(index, 1);
      saveSearchHistory(history);
      renderHistory();
    };
    
    clearHistoryBtn.addEventListener('click', () => {
      if (confirm('Clear all search history?')) {
        saveSearchHistory([]);
        renderHistory();
      }
    });
    
    // Show/hide history based on search input focus
    q.addEventListener('focus', () => {
      renderHistory();
    });
    
    q.addEventListener('blur', () => {
      // Delay hiding to allow clicks on history items
      setTimeout(() => {
        if (document.activeElement !== clearHistoryBtn && !historyList.contains(document.activeElement)) {
          searchHistory.classList.remove('show');
        }
      }, 200);
    });
    
    // Initial render
    renderHistory();

const sampleSuggestions = [
  { text: 'Who Made This Engine?', url: 'https://github.com/reaxon4u' },
  'Cat Images',
  'Reaxon engine tips and tricks',
  'Latest tech news',
  'Saturn images',

];

function renderSuggestions(filter = '') {
  suggestionsEl.innerHTML = '';
  
  // Combine sample suggestions with search history
  const history = getSearchHistory().slice(0, 3);
  const allSuggestions = [
    ...sampleSuggestions,
    ...history.map(item => `Recent: ${item}`)
  ];
  
  const list = allSuggestions
    .filter(s => {
      const text = typeof s === 'string' ? s : s.text;
      return text.toLowerCase().includes(filter.toLowerCase());
    })
    .slice(0, 6);

  list.forEach((s, index) => {
    const el = document.createElement('div');
    el.className = 'sugg';
    el.style.animationDelay = (index * 0.05) + 's';
    el.style.opacity = '0';
    el.style.animation = 'fadeInUp 0.3s ease forwards';

    if (typeof s === 'object' && s.url) {
      el.innerHTML = `<a href="${s.url}" target="_blank" style="color:inherit;text-decoration:none;">${s.text}</a>`;
    } else {
      const displayText = s.startsWith('Recent: ') ? s : s;
      el.textContent = displayText;
      el.addEventListener('click', () => { 
        const query = s.startsWith('Recent: ') ? s.replace('Recent: ', '') : s;
        q.value = query; 
        doSearch(); 
      });
    }

    suggestionsEl.appendChild(el);
  });

  suggestionsEl.style.display = list.length ? 'block' : 'none';
}
	
    q.addEventListener('input', e => {
      const query = e.target.value.trim().toLowerCase();
      renderSuggestions(e.target.value);
      
      // Check for beyblade easter egg
      if (query === 'purplekat26d21') {
        activateBeybladeMode();
      } else if (isBeybladeMode && query !== 'purplekat26d21') {
        deactivateBeybladeMode();
      }
      
      // Reset button state
      searchBtn.innerHTML = 'Search';
      searchBtn.disabled = false;
    });
    
    clearBtn.addEventListener('click', ()=>{ 
      q.value=''; 
      q.focus(); 
      renderSuggestions(''); 
      searchHistory.classList.remove('show');
      
      // Revert beyblade mode if active
      if (isBeybladeMode) {
        deactivateBeybladeMode();
      }
    });

function doSearch(){
  const query = q.value.trim();
  if(!query) return;
  
  // 🐱 Easter Egg: Purplekat26d21
  if (query.toLowerCase() === 'purplekat26d21') {
    // Ensure beyblade mode is active before redirecting
    activateBeybladeMode();
    // Small delay to show the theme change
    setTimeout(() => {
      window.location.href = 'https://x.com/purplecatlol';
    }, 300);
    return;
  }
  
  // Add to search history
  addToHistory(query);
  
  const base = engineSelect.value;
  const url = base + encodeURIComponent(query);
  
  // Add loading state
  searchBtn.innerHTML = '<span class="loading"></span>';
  searchBtn.disabled = true;
  
  // Small delay for visual feedback
  setTimeout(() => {
    window.location.href = url; // opens in the same page
  }, 150);
}

    renderSuggestions();
    
    // Close popup when clicked
    easterEggPopup.addEventListener('click', () => {

function applyTheme(themeName) {
  const theme = themes[themeName];
  if (!theme) return;
  
  const root = document.documentElement;
  root.style.setProperty('--bg', theme.bg);
  root.style.setProperty('--card', theme.card);
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--accent2', theme.accent2);
  root.style.setProperty('--muted', theme.muted);
  root.style.setProperty('--glass', theme.glass);
  document.body.style.background = theme.bodyBg;
  document.body.style.color = theme.textColor;
  
  // Update active theme indicator
  document.querySelectorAll('.theme-option').forEach(opt => {
    opt.classList.remove('active');
    if (opt.dataset.theme === themeName) {
      opt.classList.add('active');
    }
  });
  
  // Update particles color to match theme
  document.querySelectorAll('.particle').forEach(particle => {
    particle.style.background = theme.accent;
  });
  
  // Save to localStorage
  localStorage.setItem('reaxon-theme', themeName);
}

// Load saved theme
const savedTheme = localStorage.getItem('reaxon-theme') || 'dark';
applyTheme(savedTheme);

// Create particles after theme is applied
const currentThemeColor = themes[savedTheme]?.accent || themes.dark.accent;
createParticles(currentThemeColor);

// Theme selector UI
const themeBtn = document.getElementById('themeBtn');
const themeDropdown = document.getElementById('themeDropdown');
const themeOptions = document.querySelectorAll('.theme-option');

themeBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const isOpen = themeDropdown.classList.contains('show');
  themeDropdown.classList.toggle('show');
  themeBtn.setAttribute('aria-expanded', !isOpen);
});

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
  if (!themeBtn.contains(e.target) && !themeDropdown.contains(e.target)) {
    themeDropdown.classList.remove('show');
    themeBtn.setAttribute('aria-expanded', 'false');
  }
});

// Theme option selection
themeOptions.forEach(option => {
  option.addEventListener('click', () => {
    const themeName = option.dataset.theme;
    applyTheme(themeName);
    themeDropdown.classList.remove('show');
    themeBtn.setAttribute('aria-expanded', 'false');
  });
});

// Keyboard shortcuts
window.addEventListener('keydown', (e) => {
  // Ctrl+K or Cmd+K to focus search
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    q.focus();
    q.select();
  }
  
  // T key to toggle theme selector
  if (e.key === 't' && !e.ctrlKey && !e.metaKey && !e.shiftKey && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    themeDropdown.classList.toggle('show');
    themeBtn.setAttribute('aria-expanded', themeDropdown.classList.contains('show'));
  }
  
  // Escape to close theme dropdown
  if (e.key === 'Escape' && themeDropdown.classList.contains('show')) {
    themeDropdown.classList.remove('show');
    themeBtn.setAttribute('aria-expanded', 'false');
  }
  
  // Arrow keys for suggestions navigation
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const suggestions = suggestionsEl.querySelectorAll('.sugg');
    if (suggestions.length > 0 && document.activeElement === q) {
      e.preventDefault();
      const currentIndex = Array.from(suggestions).findIndex(s => s === document.activeElement);
      let nextIndex;
      if (e.key === 'ArrowDown') {
        nextIndex = currentIndex < 0 ? 0 : (currentIndex + 1) % suggestions.length;
      } else {
        nextIndex = currentIndex <= 0 ? suggestions.length - 1 : currentIndex - 1;
      }
      suggestions[nextIndex].focus();
      suggestions[nextIndex].click();
    }
  }
});
