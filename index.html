<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/Caticon.jpg">
    <title>ReaSearch</title>
    <style>
        .logo {
            width: 90px;
            height: 90px;
            border-radius: 18px;
            background: none;
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
            overflow: hidden;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
        }

        :root {
            --bg: #0f1724;
            --card: #0b1220;
            --accent: #8b5cf6;
            --muted: #9aa4b2;
            --glass: rgba(255, 255, 255, 0.04);
            --accent2: #06b6d4
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease
        }

        html,
        body {
            height: 100%;
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial
        }

        body {
            background: radial-gradient(1200px 600px at 10% 10%, rgba(139, 92, 246, 0.12), transparent), linear-gradient(180deg, #041024 0%, #071223 100%);
            color: #e6eef8;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.5s ease, color 0.3s ease, background-image 0.5s ease;
            position: relative
        }





        .top-right-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .search-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            width: 100%;
        }





        .card {
            width: min(920px, 94vw);
            padding: 36px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(6px);
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.6);
            transition: background 0.5s ease, box-shadow 0.5s ease;
            position: relative;
            z-index: 1;
            min-height: 200px
        }

        .brand {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 22px
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: linear-gradient(135deg, #7c3aed, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 18px rgba(92, 51, 163, 0.25), inset 0 -6px 18px rgba(255, 255, 255, 0.06)
        }

        .logo svg {
            width: 46px;
            height: 46px;
            filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.35))
        }

        .title {
            line-height: 1
        }

        .title h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: -0.2px
        }

        .title p {
            margin: 0;
            color: var(--muted);
            font-size: 13px
        }

        .search-row {
            display: flex;
            gap: 12px;
            align-items: center;
            max-width: 800px;
            width: 100%;
            transition: max-width 0.3s ease
        }

        .search-row.centered {
            max-width: 600px;
            margin: 0 auto
        }

        .search-input {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--glass);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: border-color 0.3s ease, background 0.3s ease
        }

        .search-input:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1)
        }

        .search-input input {
            flex: 1;
            background: transparent;
            border: 0;
            outline: none;
            color: inherit;
            font-size: 16px;
            padding: 6px
        }

        .icon-btn {
            background: transparent;
            border: 0;
            color: var(--muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: color 0.2s ease, background 0.2s ease
        }

        .icon-btn:hover {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.05)
        }

        /* Search engine dropdown with icons */
        .engine-selector {
            position: relative;
            display: inline-block;
        }

        .engine-select-btn {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            min-width: 50px;
            justify-content: center;
        }

        .engine-select-btn:hover {
            border-color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
        }

        .engine-select-btn img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .engine-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 4px;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .engine-dropdown.show {
            display: flex;
        }

        .engine-option {
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s ease;
        }

        .engine-option:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .engine-option.active {
            background: rgba(139, 92, 246, 0.1);
        }

        .engine-option img {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .engine-option span {
            font-size: 14px;
            color: var(--muted);
        }

        .engine-option:hover span,
        .engine-option.active span {
            color: var(--accent);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 14px
        }

        select {
            background: transparent;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: inherit;
            cursor: pointer;
            transition: border-color 0.2s ease
        }

        select:hover,
        select:focus {
            border-color: var(--accent);
            outline: none
        }

        .actions {
            margin-left: auto;
            display: flex;
            gap: 8px
        }

        .btn {
            padding: 9px 14px;
            border-radius: 9px;
            border: 0;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            color: #021026;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.1)
        }

        .btn:active {
            transform: translateY(0)
        }

        .ghost {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--muted);
            transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease
        }

        .ghost:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
            color: var(--accent)
        }

        .suggestions {
            margin-top: 14px;
            background: transparent;
            border-radius: 10px;
            padding: 8px;
            display: grid;
            gap: 6px;
            transition: max-height 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
            overflow: hidden;
            opacity: 1
        }

        .suggestions.collapsed {
            max-height: 0 !important;
            opacity: 0;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            padding: 0;
        }

        .sugg {
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--muted);
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease
        }

        .sugg:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--accent);
            transform: translateX(4px)
        }

        .footer {
            margin-top: 18px;
            color: var(--muted);
            font-size: 13px;
            text-align: right
        }

        .copyright-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
            text-align: right;
            width: 100%
        }

        .copyright-btn:hover {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.05)
        }

        .copyright-info {
            color: var(--muted);
            font-size: 13px;
            text-align: right;
            margin-top: 4px;
            animation: fadeIn 0.3s ease
        }

        .quick-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
            font-size: 26px;
            position: relative;
        }

        .quick-picks-header {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 8px;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .quick-picks-toggle {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-picks-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent);
            color: var(--accent);
        }

        .search-row-wrapper {
            transition: margin-top 0.3s ease;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .quick-links a,
        .bookmark-item {
            text-decoration: none;
            transition: transform 0.2s, filter 0.2s, opacity 0.2s;
            position: relative;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quick-links a img,
        .bookmark-item img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }

        .quick-links a:hover,
        .bookmark-item:hover {
            transform: scale(1.2);
            filter: drop-shadow(0 0 8px var(--accent));
        }

        .bookmark-item {
            position: relative;
        }

        .bookmark-item.dragging {
            opacity: 0.5;
            transform: scale(0.9);
        }

        .bookmark-item .delete-bookmark {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            font-size: 12px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.2s;
        }

        .bookmark-item:hover .delete-bookmark {
            display: flex;
        }

        .bookmark-item .delete-bookmark:hover {
            background: #ef4444;
            transform: scale(1.1);
        }

        .add-bookmark-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--glass);
            border: 2px dashed var(--accent);
            color: var(--accent);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .add-bookmark-btn:hover {
            background: var(--accent);
            color: white;
            transform: scale(1.1);
        }

        /* Modal for adding bookmarks */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 24px;
            min-width: 400px;
            max-width: 90vw;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 20px;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            color: var(--accent);
            background: rgba(255, 255, 255, 0.05);
        }

        .modal-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-form label {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .modal-form input {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
            color: inherit;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .modal-form input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 8px;
        }

        /* Search suggestions dropdown */
        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-top: 8px;
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .search-suggestions.show {
            display: block;
        }

        .search-suggestion-item {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .search-suggestion-item:hover,
        .search-suggestion-item.selected {
            background: rgba(255, 255, 255, 0.05);
        }

        .search-suggestion-item .suggestion-icon {
            color: var(--muted);
            font-size: 16px;
        }

        .search-suggestion-item .suggestion-text {
            flex: 1;
            color: var(--muted);
        }

        .search-suggestion-item:hover .suggestion-text,
        .search-suggestion-item.selected .suggestion-text {
            color: var(--accent);
        }

        .search-input {
            position: relative;
        }

        @media (max-width:520px) {
            .card {
                padding: 18px
            }

            .logo {
                width: 56px;
                height: 56px
            }

            .theme-dropdown {
                grid-template-columns: repeat(2, 1fr);
                min-width: 200px
            }

            .search-row {
                flex-direction: column;
                gap: 10px
            }

            .search-row>div {
                width: 100%
            }

            .search-row select {
                width: 100%
            }
        }

        kbd {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            font-family: monospace;
            color: var(--accent);
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            25% {
                transform: translate(100px, -100px) scale(1.2);
            }

            50% {
                transform: translate(-50px, 100px) scale(0.8);
            }

            75% {
                transform: translate(-100px, -50px) scale(1.1);
            }
        }

        /* Time-based greeting */
        .greeting {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeInUp 0.6s ease 0.2s forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Search history */
        .search-history {
            margin-top: 12px;
            padding: 8px;
            border-radius: 10px;
            background: transparent;
            display: none;
        }

        .search-history.show {
            display: block;
        }

        .history-title {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item {
            padding: 8px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.02);
            color: var(--muted);
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
            transform: translateX(4px);
        }

        .history-item .delete-btn {
            opacity: 0;
            transition: opacity 0.2s ease;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .history-item:hover .delete-btn {
            opacity: 1;
        }

        .history-item .delete-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--accent);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Card entrance animation */
        .card {
            animation: cardEntrance 0.6s ease-out;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Pulse animation for logo */
        .logo {
            animation: logoPulse 3s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
            }

            50% {
                box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
            }
        }

        .theme-selector {
            position: relative;
            display: inline-block;
        }

        #themeBtn {
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
            color: #021026;
            transition: transform 0.2s ease, filter 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            font-size: 20px;
        }

        #themeBtn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .theme-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 8px;
            display: none;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            min-width: 280px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            z-index: 1000;
            animation: fadeIn 0.2s ease;
        }

        .theme-dropdown.show {
            display: grid;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .theme-option {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .theme-option:hover {
            transform: scale(1.1);
            border-color: var(--accent);
        }

        .theme-option.active {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent);
        }

        .theme-option::after {
            content: '✓';
            position: absolute;
            top: 4px;
            right: 4px;
            color: white;
            font-weight: bold;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .theme-option.active::after {
            opacity: 1;
        }

        .theme-label {
            position: absolute;
            bottom: 4px;
            left: 4px;
            right: 4px;
            font-size: 10px;
            color: white;
            text-align: center;
            font-weight: 600;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .keyboard-hint {
            font-size: 11px;
            color: var(--muted);
            margin-top: 8px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="particles" id="particles"></div>


    <main class="card">
        <div class="brand">
            <div class="logo" aria-hidden>
                <img src="assets/Main1.png" alt="Reaxon Logo" class="logo-img">
            </div>

            <div class="title">
                <div class="greeting" id="greeting"></div>
                <h1>ReaSearch</h1>
                <p>Fast, Private & Secure! ReaSearch IT!</p>
            </div>
        </div>

        <div class="search-row-wrapper" id="searchRowWrapper">
            <div class="search-row centered" id="searchRow">
                <div class="search-input" role="search">
                    <input id="q" type="search" autocomplete="off" placeholder="Search the cosmos..."
                        aria-label="Search query" />
                    <button class="icon-btn" id="clearBtn" title="Clear" aria-label="Clear search">✕</button>
                    <div class="search-suggestions" id="searchSuggestions"></div>
                </div>
            </div>
        </div>

        <div class="search-actions">
            <button class="btn" id="searchBtn">Search</button>
            <button class="ghost btn" id="luckyBtn">I'm Feeling Lucky</button>
        </div>

        <div class="quick-links" id="quickLinks">
        </div>

        <div class="modal-overlay" id="bookmarkModal">
            <div class="modal">
                <div class="modal-header">
                    <h3>Add Bookmark</h3>
                    <button class="modal-close" id="closeModal">×</button>
                </div>
                <form class="modal-form" id="bookmarkForm">
                    <div>
                        <label for="bookmarkUrl">Website URL</label>
                        <input type="url" id="bookmarkUrl" placeholder="https://example.com" required />
                    </div>
                    <div>
                        <label for="bookmarkTitle">Title (optional)</label>
                        <input type="text" id="bookmarkTitle" placeholder="Website name" />
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="ghost btn" id="cancelBookmark">Cancel</button>
                        <button type="submit" class="btn">Add Bookmark</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="controls">
            <div style="display:flex;gap:8px;align-items:center;width:100%">
                <label style="color:var(--muted);font-size:13px">Quick picks</label>
                <div style="display:flex;gap:6px">
                    <button class="ghost btn" id="trendingBtn">Trending</button>
                    <button class="ghost btn" id="imagesBtn">Images</button>
                </div>
            </div>
        </div>

        <div class="quick-picks-header">
            <button class="quick-picks-toggle" id="quickPicksToggle">
                <span id="quickPicksToggleIcon">▶</span>
                <span>Suggestions</span>
            </button>
        </div>

        <div class="suggestions collapsed" id="suggestions" aria-hidden></div>

        <div class="search-history" id="searchHistory">
            <div class="history-title">
                <span>Recent Searches</span>
                <button class="ghost btn" id="clearHistory" style="padding:4px 8px;font-size:11px">Clear All</button>
            </div>
            <div id="historyList"></div>
        </div>

        <div class="top-right-actions">
            <!-- Search Engine Selector -->
            <div class="engine-selector">
                <button class="engine-select-btn" id="engineSelectBtn" title="Choose search engine"
                    aria-label="Choose search engine">
                    <img id="engineIcon" src="https://www.google.com/s2/favicons?sz=64&domain=google.com"
                        alt="Search engine icon" />
                </button>
                <div class="engine-dropdown" id="engineDropdown">
                    <div class="engine-option active" data-engine="https://www.google.com/search?q="
                        data-icon="https://www.google.com/s2/favicons?sz=64&domain=google.com">
                        <img src="https://www.google.com/s2/favicons?sz=64&domain=google.com" alt="Google" />
                        <span>Google</span>
                    </div>
                    <div class="engine-option" data-engine="https://duckduckgo.com/?q="
                        data-icon="https://www.google.com/s2/favicons?sz=64&domain=duckduckgo.com">
                        <img src="https://www.google.com/s2/favicons?sz=64&domain=duckduckgo.com" alt="DuckDuckGo" />
                        <span>DuckDuckGo</span>
                    </div>
                    <div class="engine-option" data-engine="https://www.bing.com/search?q="
                        data-icon="https://www.google.com/s2/favicons?sz=64&domain=bing.com">
                        <img src="https://www.google.com/s2/favicons?sz=64&domain=bing.com" alt="Bing" />
                        <span>Bing</span>
                    </div>
                </div>
            </div>

            <!-- Theme Selector -->
            <div class="theme-selector">
                <button class="btn" id="themeBtn" aria-label="Change theme" aria-expanded="false">
                    <span>🎨</span>
                </button>
                <div class="theme-dropdown" id="themeDropdown" role="menu" aria-label="Theme options">
                    <div class="theme-option active" data-theme="dark" role="menuitem" aria-label="Dark theme"
                        style="background: linear-gradient(135deg, #0f1724, #1e293b);">
                        <span class="theme-label">Dark</span>
                    </div>
                    <div class="theme-option" data-theme="light" role="menuitem" aria-label="Light theme"
                        style="background: linear-gradient(135deg, #f7f8fa, #e5e7eb);">
                        <span class="theme-label">Light</span>
                    </div>
                    <div class="theme-option" data-theme="purple" role="menuitem" aria-label="Purple theme"
                        style="background: linear-gradient(135deg, #6b21a8, #a855f7);">
                        <span class="theme-label">Purple</span>
                    </div>
                    <div class="theme-option" data-theme="green" role="menuitem" aria-label="Green theme"
                        style="background: linear-gradient(135deg, #166534, #22c55e);">
                        <span class="theme-label">Green</span>
                    </div>
                    <div class="theme-option" data-theme="sunset" role="menuitem" aria-label="Sunset theme"
                        style="background: linear-gradient(135deg, #ea580c, #f97316);">
                        <span class="theme-label">Sunset</span>
                    </div>
                    <div class="theme-option" data-theme="red" role="menuitem" aria-label="Red theme"
                        style="background: linear-gradient(135deg, #991b1b, #dc2626);">
                        <span class="theme-label">Red</span>
                    </div>
                    <div class="theme-option" data-theme="brown" role="menuitem" aria-label="Brown theme"
                        style="background: linear-gradient(135deg, #451a03, #92400e);">
                        <span class="theme-label">Brown</span>
                    </div>
                    <div class="theme-option" data-theme="pink" role="menuitem" aria-label="Pink theme"
                        style="background: linear-gradient(135deg, #831843, #db2777);">
                        <span class="theme-label">Pink</span>
                    </div>
                    <div class="theme-option" data-theme="midnight" role="menuitem" aria-label="Midnight theme"
                        style="background: linear-gradient(135deg, #020617, #1e293b);">
                        <span class="theme-label">Midnight</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            <button class="copyright-btn" id="copyrightBtn" aria-label="Show copyright information">
                Dev Info
            </button>
            <div class="copyright-info" id="copyrightInfo" style="display: none;">
                <strong>ReaXon</strong> • Version 2.1 • E For Efforts❤️
            </div>
        </div>
    </main>

    <script>
        // Initialize elements
        const q = document.getElementById('q');
        const searchBtn = document.getElementById('searchBtn');
        const engineSelectBtn = document.getElementById('engineSelectBtn');
        const engineDropdown = document.getElementById('engineDropdown');
        const engineIcon = document.getElementById('engineIcon');
        const engineOptions = document.querySelectorAll('.engine-option');
        let currentEngine = 'https://www.google.com/search?q=';
        const suggestionsEl = document.getElementById('suggestions');
        const clearBtn = document.getElementById('clearBtn');
        const luckyBtn = document.getElementById('luckyBtn');
        const searchHistory = document.getElementById('searchHistory');
        const historyList = document.getElementById('historyList');
        const clearHistoryBtn = document.getElementById('clearHistory');


        // Copyright button toggle functionality
        copyrightBtn.addEventListener('click', () => {
            const isVisible = copyrightInfo.style.display !== 'none';
            copyrightInfo.style.display = isVisible ? 'none' : 'block';
        });

        // Suggestions collapse functionality
        let suggestionsCollapsed = true;

        // Load saved state
        const savedCollapsedState = localStorage.getItem('reaxon-suggestions-collapsed');
        if (savedCollapsedState !== null) {
            suggestionsCollapsed = savedCollapsedState === 'true';
        }

        function updateSuggestionsState() {
            if (suggestionsCollapsed) {
                suggestionsEl.classList.add('collapsed');
                quickPicksToggleIcon.textContent = '▶';
                searchRow.classList.add('centered');
            } else {
                suggestionsEl.classList.remove('collapsed');
                quickPicksToggleIcon.textContent = '▼';
                searchRow.classList.remove('centered');
                // Set max-height to actual content height
                const height = suggestionsEl.scrollHeight;
                suggestionsEl.style.maxHeight = height + 'px';
            }
            localStorage.setItem('reaxon-suggestions-collapsed', suggestionsCollapsed.toString());
        }

        quickPicksToggle.addEventListener('click', () => {
            suggestionsCollapsed = !suggestionsCollapsed;
            updateSuggestionsState();
        });

        // Initialize state
        updateSuggestionsState();

        // Search engine selector with icons
        engineSelectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            engineDropdown.classList.toggle('show');
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!engineSelectBtn.contains(e.target) && !engineDropdown.contains(e.target)) {
                engineDropdown.classList.remove('show');
            }
        });

        // Handle engine selection
        engineOptions.forEach(option => {
            option.addEventListener('click', () => {
                const engine = option.dataset.engine;
                const icon = option.dataset.icon;
                currentEngine = engine;
                engineIcon.src = icon;

                // Update active state
                engineOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');

                engineDropdown.classList.remove('show');
            });
        });

        // Load saved engine preference
        const savedEngine = localStorage.getItem('reaxon-search-engine');
        if (savedEngine) {
            const savedOption = Array.from(engineOptions).find(opt => opt.dataset.engine === savedEngine);
            if (savedOption) {
                savedOption.click();
            }
        } else {
            // Default to Google
            engineOptions[0].click();
        }

        // Save engine preference when changed
        engineOptions.forEach(option => {
            option.addEventListener('click', () => {
                localStorage.setItem('reaxon-search-engine', currentEngine);
            });
        });

        // Search suggestions state
        let currentSuggestions = [];
        let selectedSuggestionIndex = -1;
        let suggestionTimeout = null;





        // Time-based greeting
        function updateGreeting() {
            const hour = new Date().getHours();
            const greetingEl = document.getElementById('greeting');
            let greeting = '';

            if (hour < 12) {
                greeting = 'Good Morning! ☀️';
            } else if (hour < 17) {
                greeting = 'Good Afternoon! 🌤️';
            } else if (hour < 21) {
                greeting = 'Good Evening! 🌆';
            } else {
                greeting = 'Good Night! 🌙';
            }

            greetingEl.textContent = greeting;
        }
        updateGreeting();

        // Animated background particles (will be called after themes are defined)
        function createParticles(themeColor = '#8b5cf6') {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 100 + 50;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.background = themeColor;
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Search history management
        function getSearchHistory() {
            const history = localStorage.getItem('reaxon-search-history');
            return history ? JSON.parse(history) : [];
        }

        function saveSearchHistory(history) {
            localStorage.setItem('reaxon-search-history', JSON.stringify(history));
        }

        function addToHistory(query) {
            if (!query || query.trim() === '') return;

            let history = getSearchHistory();
            // Remove if already exists
            history = history.filter(item => item.toLowerCase() !== query.toLowerCase());
            // Add to beginning
            history.unshift(query);
            // Keep only last 10
            history = history.slice(0, 10);
            saveSearchHistory(history);
            renderHistory();
        }

        function renderHistory() {
            const history = getSearchHistory();
            historyList.innerHTML = '';

            if (history.length === 0) {
                searchHistory.classList.remove('show');
                return;
            }

            searchHistory.classList.add('show');

            history.forEach((item, index) => {
                const historyItem = document.createElement('div');
                historyItem.className = 'history-item';
                historyItem.innerHTML = `
          <span onclick="selectHistoryItem('${item.replace(/'/g, "\\'")}')">${item}</span>
          <button class="delete-btn" onclick="deleteHistoryItem(${index})" aria-label="Delete">×</button>
        `;
                historyList.appendChild(historyItem);
            });
        }

        window.selectHistoryItem = function (query) {
            q.value = query;
            q.focus();
            doSearch();
        };

        window.deleteHistoryItem = function (index) {
            let history = getSearchHistory();
            history.splice(index, 1);
            saveSearchHistory(history);
            renderHistory();
        };

        clearHistoryBtn.addEventListener('click', () => {
            if (confirm('Clear all search history?')) {
                saveSearchHistory([]);
                renderHistory();
            }
        });

        // Show/hide history based on search input focus
        q.addEventListener('focus', () => {
            renderHistory();
        });

        q.addEventListener('blur', () => {
            // Delay hiding to allow clicks on history items
            setTimeout(() => {
                if (document.activeElement !== clearHistoryBtn && !historyList.contains(document.activeElement)) {
                    searchHistory.classList.remove('show');
                }
            }, 200);
        });

        // Initial render
        renderHistory();

        // Bookmarks management
        const defaultBookmarks = [
            { url: 'https://www.youtube.com', title: 'YouTube' },
            { url: 'https://x.com', title: 'X (Twitter)' },
            { url: 'https://discord.com/channels/@me', title: 'Discord' },
            { url: 'https://www.instagram.com', title: 'Instagram' },
            { url: 'https://www.reddit.com', title: 'Reddit' },
            { url: 'https://github.com', title: 'GitHub' },
            { url: 'https://open.spotify.com', title: 'Spotify' },
            { url: 'https://www.wikipedia.org', title: 'Wikipedia' }
        ];

        function getBookmarks() {
            const saved = localStorage.getItem('reaxon-bookmarks');
            if (saved) {
                return JSON.parse(saved);
            }
            return defaultBookmarks;
        }

        function saveBookmarks(bookmarks) {
            localStorage.setItem('reaxon-bookmarks', JSON.stringify(bookmarks));
        }

        function getDomainFromUrl(url) {
            try {
                const urlObj = new URL(url);
                return urlObj.hostname.replace('www.', '');
            } catch {
                return url;
            }
        }

        function renderBookmarks() {
            const bookmarks = getBookmarks();
            // Remove all children except the add button if it exists
            const addBtn = quickLinks.querySelector('.add-bookmark-btn');
            quickLinks.innerHTML = '';

            bookmarks.forEach((bookmark, index) => {
                const domain = getDomainFromUrl(bookmark.url);
                const faviconUrl = `https://www.google.com/s2/favicons?sz=64&domain=${domain}`;

                const bookmarkEl = document.createElement('div');
                bookmarkEl.className = 'bookmark-item';
                bookmarkEl.draggable = true;
                bookmarkEl.dataset.index = index;
                bookmarkEl.innerHTML = `
          <a href="${bookmark.url}" target="_blank" title="${bookmark.title || domain}">
            <img src="${faviconUrl}" alt="${bookmark.title || domain}" />
          </a>
          <button class="delete-bookmark" onclick="deleteBookmark(${index})" aria-label="Delete bookmark">×</button>
        `;

                // Drag and drop handlers
                bookmarkEl.addEventListener('dragstart', (e) => {
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/html', bookmarkEl.outerHTML);
                    e.dataTransfer.setData('text/plain', index.toString());
                    bookmarkEl.classList.add('dragging');
                });

                bookmarkEl.addEventListener('dragend', () => {
                    bookmarkEl.classList.remove('dragging');
                });

                bookmarkEl.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const afterElement = getDragAfterElement(quickLinks, e.clientX);
                    const dragging = document.querySelector('.dragging');
                    if (afterElement == null) {
                        quickLinks.appendChild(dragging);
                    } else {
                        quickLinks.insertBefore(dragging, afterElement);
                    }
                });

                bookmarkEl.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const draggedIndex = parseInt(e.dataTransfer.getData('text/plain'));
                    const bookmarks = getBookmarks();
                    const draggedItem = bookmarks[draggedIndex];
                    bookmarks.splice(draggedIndex, 1);

                    const newIndex = Array.from(quickLinks.children).indexOf(bookmarkEl);
                    bookmarks.splice(newIndex, 0, draggedItem);

                    saveBookmarks(bookmarks);
                    renderBookmarks();
                });

                quickLinks.appendChild(bookmarkEl);
            });

            // Add + button
            const newAddBtn = document.createElement('button');
            newAddBtn.className = 'add-bookmark-btn';
            newAddBtn.innerHTML = '+';
            newAddBtn.title = 'Add bookmark';
            newAddBtn.addEventListener('click', () => {
                bookmarkModal.classList.add('show');
                document.getElementById('bookmarkUrl').focus();
            });
            quickLinks.appendChild(newAddBtn);
        }

        function getDragAfterElement(container, x) {
            const draggableElements = [...container.querySelectorAll('.bookmark-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = x - box.left - box.width / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        window.deleteBookmark = function (index) {
            if (confirm('Delete this bookmark?')) {
                const bookmarks = getBookmarks();
                bookmarks.splice(index, 1);
                saveBookmarks(bookmarks);
                renderBookmarks();
            }
        };

        // Bookmark modal handlers
        bookmarkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('bookmarkUrl').value.trim();
            const title = document.getElementById('bookmarkTitle').value.trim();

            if (!url) return;

            // Ensure URL has protocol
            let finalUrl = url;
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                finalUrl = 'https://' + url;
            }

            const bookmarks = getBookmarks();
            const domain = getDomainFromUrl(finalUrl);

            bookmarks.push({
                url: finalUrl,
                title: title || domain
            });

            saveBookmarks(bookmarks);
            renderBookmarks();

            // Reset form and close modal
            bookmarkForm.reset();
            bookmarkModal.classList.remove('show');
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            bookmarkModal.classList.remove('show');
        });

        document.getElementById('cancelBookmark').addEventListener('click', () => {
            bookmarkModal.classList.remove('show');
        });

        bookmarkModal.addEventListener('click', (e) => {
            if (e.target === bookmarkModal) {
                bookmarkModal.classList.remove('show');
            }
        });

        // Initialize bookmarks
        renderBookmarks();

        // Search suggestions API - Google-like autocomplete
        async function fetchSearchSuggestions(query) {
            if (!query || query.length < 2) {
                searchSuggestions.classList.remove('show');
                return;
            }

            const suggestions = [];
            const lowerQuery = query.toLowerCase();

            // 1. Add search history matches (prioritized - exact matches first)
            const history = getSearchHistory();
            const exactMatches = [];
            const startsWithMatches = [];
            const containsMatches = [];

            history.forEach(item => {
                const lowerItem = item.toLowerCase();
                if (lowerItem === lowerQuery) {
                    exactMatches.push(item);
                } else if (lowerItem.startsWith(lowerQuery)) {
                    startsWithMatches.push(item);
                } else if (lowerItem.includes(lowerQuery)) {
                    containsMatches.push(item);
                }
            });

            suggestions.push(...exactMatches, ...startsWithMatches, ...containsMatches);

            // 2. Try to fetch from DuckDuckGo autocomplete using JSONP
            let jsonpLoaded = false;
            try {
                const script = document.createElement('script');
                const callbackName = 'ddgCallback' + Date.now();

                window[callbackName] = (data) => {
                    jsonpLoaded = true;
                    if (data && Array.isArray(data) && data.length > 1 && Array.isArray(data[1])) {
                        data[1].forEach(suggestion => {
                            if (suggestions.length < 8 && !suggestions.includes(suggestion)) {
                                suggestions.push(suggestion);
                            }
                        });
                        displaySearchSuggestions(suggestions.slice(0, 8), query);
                    }
                    cleanup();
                };

                const cleanup = () => {
                    delete window[callbackName];
                    if (script.parentNode) {
                        document.body.removeChild(script);
                    }
                };

                script.src = `https://duckduckgo.com/ac/?q=${encodeURIComponent(query)}&callback=${callbackName}`;
                script.onerror = () => {
                    cleanup();
                    if (!jsonpLoaded) {
                        addLocalSuggestions(suggestions, query);
                        displaySearchSuggestions(suggestions.slice(0, 8), query);
                    }
                };

                document.body.appendChild(script);

                // Timeout fallback
                setTimeout(() => {
                    if (!jsonpLoaded && window[callbackName]) {
                        cleanup();
                        addLocalSuggestions(suggestions, query);
                        displaySearchSuggestions(suggestions.slice(0, 8), query);
                    }
                }, 1500);
            } catch (error) {
                // Fallback to local suggestions
                addLocalSuggestions(suggestions, query);
                displaySearchSuggestions(suggestions.slice(0, 8), query);
            }

            // Show initial suggestions immediately (from history)
            if (suggestions.length > 0) {
                displaySearchSuggestions(suggestions.slice(0, 8), query);
            } else {
                // If no history matches, show local suggestions immediately
                addLocalSuggestions(suggestions, query);
                displaySearchSuggestions(suggestions.slice(0, 8), query);
            }
        }

        function addLocalSuggestions(suggestions, query) {
            // Add intelligent common patterns
            const commonPatterns = [
                `${query} meaning`,
                `${query} definition`,
                `${query} wiki`,
                `${query} images`,
                `${query} news`,
                `${query} tutorial`,
                `how to ${query}`,
                `what is ${query}`
            ];

            commonPatterns.forEach(pattern => {
                if (suggestions.length < 8 && !suggestions.includes(pattern)) {
                    suggestions.push(pattern);
                }
            });

            // Add sample suggestions that match
            const sampleMatches = sampleSuggestions
                .filter(s => {
                    const text = typeof s === 'string' ? s : s.text;
                    return text.toLowerCase().includes(query.toLowerCase());
                })
                .map(s => typeof s === 'string' ? s : s.text);

            sampleMatches.forEach(match => {
                if (suggestions.length < 8 && !suggestions.includes(match)) {
                    suggestions.push(match);
                }
            });
        }

        function displaySearchSuggestions(suggestions, query) {
            if (suggestions.length === 0) {
                searchSuggestions.classList.remove('show');
                return;
            }

            currentSuggestions = suggestions;
            selectedSuggestionIndex = -1;
            searchSuggestions.innerHTML = '';

            suggestions.forEach((suggestion, index) => {
                const item = document.createElement('div');
                item.className = 'search-suggestion-item';
                item.dataset.index = index;
                item.innerHTML = `
          <span class="suggestion-icon">🔍</span>
          <span class="suggestion-text">${suggestion}</span>
        `;
                item.addEventListener('click', () => {
                    q.value = suggestion;
                    searchSuggestions.classList.remove('show');
                    doSearch();
                });
                item.addEventListener('mouseenter', () => {
                    selectedSuggestionIndex = index;
                    updateSuggestionSelection();
                });
                searchSuggestions.appendChild(item);
            });

            searchSuggestions.classList.add('show');
        }

        function updateSuggestionSelection() {
            const items = searchSuggestions.querySelectorAll('.search-suggestion-item');
            items.forEach((item, index) => {
                if (index === selectedSuggestionIndex) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        // Enhanced search input handler with suggestions
        q.addEventListener('input', e => {
            const query = e.target.value.trim().toLowerCase();
            renderSuggestions(e.target.value);

            // Clear previous timeout
            if (suggestionTimeout) {
                clearTimeout(suggestionTimeout);
            }

            // Debounce search suggestions
            suggestionTimeout = setTimeout(() => {
                fetchSearchSuggestions(e.target.value);
            }, 300);



            // Reset button state
            searchBtn.innerHTML = 'Search';
            searchBtn.disabled = false;
        });

        // Handle keyboard navigation for suggestions
        q.addEventListener('keydown', (e) => {
            if (searchSuggestions.classList.contains('show') && currentSuggestions.length > 0) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, currentSuggestions.length - 1);
                    updateSuggestionSelection();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
                    updateSuggestionSelection();
                } else if (e.key === 'Enter' && selectedSuggestionIndex >= 0) {
                    e.preventDefault();
                    q.value = currentSuggestions[selectedSuggestionIndex];
                    searchSuggestions.classList.remove('show');
                    doSearch();
                } else if (e.key === 'Escape') {
                    searchSuggestions.classList.remove('show');
                }
            }
        });

        // Hide suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (!q.contains(e.target) && !searchSuggestions.contains(e.target)) {
                searchSuggestions.classList.remove('show');
            }
        });

        const defaultSuggestions = [
            'Cat Images',
            'Latest tech news',
            'Saturn images',
            'Best coffee near me',
            'Coding projects for beginners'
        ];



        let sampleSuggestions = [...defaultSuggestions];

        function renderSuggestions(filter = '') {
            suggestionsEl.innerHTML = '';

            // Combine sample suggestions with search history
            const history = getSearchHistory().slice(0, 3);
            const allSuggestions = [
                ...sampleSuggestions,
                ...history.map(item => `Recent: ${item}`)
            ];

            const list = allSuggestions
                .filter(s => {
                    const text = typeof s === 'string' ? s : s.text;
                    return text.toLowerCase().includes(filter.toLowerCase());
                })
                .slice(0, 6);

            list.forEach((s, index) => {
                const el = document.createElement('div');
                el.className = 'sugg';
                el.style.animationDelay = (index * 0.05) + 's';
                el.style.opacity = '0';
                el.style.animation = 'fadeInUp 0.3s ease forwards';

                if (typeof s === 'object' && s.url) {
                    el.innerHTML = `<a href="${s.url}" target="_blank" style="color:inherit;text-decoration:none;">${s.text}</a>`;
                } else {
                    const displayText = s.startsWith('Recent: ') ? s : s;
                    el.textContent = displayText;
                    el.addEventListener('click', () => {
                        const query = s.startsWith('Recent: ') ? s.replace('Recent: ', '') : s;
                        q.value = query;
                        doSearch();
                    });
                }

                suggestionsEl.appendChild(el);
            });

            suggestionsEl.style.display = list.length ? 'block' : 'none';

            // Update collapsed state after rendering - use setTimeout to ensure DOM is updated
            setTimeout(() => {
                if (!suggestionsCollapsed && list.length > 0) {
                    const height = suggestionsEl.scrollHeight;
                    suggestionsEl.style.maxHeight = height + 'px';
                }
            }, 0);
        }

        clearBtn.addEventListener('click', () => {
            q.value = '';
            q.focus();
            renderSuggestions('');
            searchHistory.classList.remove('show');
            searchSuggestions.classList.remove('show');


        });

        function doSearch() {
            const query = q.value.trim();
            if (!query) return;



            // Add to search history
            addToHistory(query);

            const base = currentEngine;
            const url = base + encodeURIComponent(query);

            // Add loading state
            searchBtn.innerHTML = '<span class="loading"></span>';
            searchBtn.disabled = true;

            // Small delay for visual feedback
            setTimeout(() => {
                window.location.href = url; // opens in the same page
            }, 150);
        }

        function doLucky() {
            const query = q.value.trim() || sampleSuggestions[Math.floor(Math.random() * sampleSuggestions.length)];



            const engine = currentEngine;
            if (engine.includes('google')) {
                const url = 'https://www.google.com/search?q=' + encodeURIComponent(query) + '&btnI=I';
                window.open(url, '_blank');
            } else {
                doSearch();
            }
        }

        searchBtn.addEventListener('click', doSearch);
        luckyBtn.addEventListener('click', doLucky);
        q.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (searchSuggestions.classList.contains('show') && selectedSuggestionIndex >= 0) {
                    // Already handled in the suggestions handler
                    return;
                }
                doSearch();
            }
        });

        document.getElementById('trendingBtn').addEventListener('click', () => { const base = currentEngine; window.open(base + encodeURIComponent('trending news'), '_blank'); });
        document.getElementById('imagesBtn').addEventListener('click', () => { const qstr = 'beautiful wallpapers'; const engine = currentEngine; if (engine.includes('duckduckgo')) window.open('https://duckduckgo.com/?q=' + encodeURIComponent(qstr) + '&iax=images&ia=images', '_blank'); else if (engine.includes('google')) window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(qstr), '_blank'); else window.open(engine + encodeURIComponent(qstr), '_blank'); });

        renderSuggestions();



        // Theme system with multiple themes
        const themes = {
            dark: {
                bg: '#0f1724',
                card: '#0b1220',
                accent: '#8b5cf6',
                accent2: '#06b6d4',
                muted: '#9aa4b2',
                glass: 'rgba(255,255,255,0.04)',
                bodyBg: 'radial-gradient(1200px 600px at 10% 10%, rgba(139,92,246,0.12), transparent), linear-gradient(180deg,#041024 0%, #071223 100%)',
                textColor: '#e6eef8'
            },
            light: {
                bg: '#f7f8fa',
                card: '#ffffff',
                accent: '#2563eb',
                accent2: '#3b82f6',
                muted: '#64748b',
                glass: 'rgba(0,0,0,0.04)',
                bodyBg: 'linear-gradient(180deg,#e5eeff 0%, #c9e4ff 100%)',
                textColor: '#111827'
            },
            purple: {
                bg: '#1a0b2e',
                card: '#2d1b3d',
                accent: '#a855f7',
                accent2: '#c084fc',
                muted: '#c4b5fd',
                glass: 'rgba(168,85,247,0.1)',
                bodyBg: 'radial-gradient(1200px 600px at 10% 10%, rgba(168,85,247,0.15), transparent), linear-gradient(180deg,#1a0b2e 0%, #4c1d95 100%)',
                textColor: '#f3e8ff'
            },
            green: {
                bg: '#0a1f0a',
                card: '#1a2e1a',
                accent: '#22c55e',
                accent2: '#4ade80',
                muted: '#86efac',
                glass: 'rgba(34,197,94,0.1)',
                bodyBg: 'radial-gradient(1200px 600px at 10% 10%, rgba(34,197,94,0.15), transparent), linear-gradient(180deg,#0a1f0a 0%, #166534 100%)',
                textColor: '#dcfce7'
            },
            sunset: {
                bg: '#2a0f0a',
                card: '#3d1a0f',
                accent: '#f97316',
                accent2: '#fb923c',
                muted: '#fdba74',
                glass: 'rgba(249,115,22,0.1)',
                bodyBg: 'radial-gradient(1200px 600px at 10% 10%, rgba(249,115,22,0.15), transparent), linear-gradient(180deg,#2a0f0a 0%, #ea580c 100%)',
                textColor: '#fff7ed'
            },
            red: {
                bg: '#180404',
                card: '#290606',
                accent: '#dc2626',
                accent2: '#ef4444',
                muted: '#fca5a5',
                glass: 'rgba(220, 38, 38, 0.1)',
                bodyBg: 'radial-gradient(1200px 600px at 10% 10%, rgba(220, 38, 38, 0.15), transparent), linear-gradient(180deg,#180404 0%, #450a0a 100%)',
                textColor: '#fef2f2'
            },
            brown: {
                bg: '#1c100b',
                card: '#2d1810',
                accent: '#d97706',
                accent2: '#f59e0b',
                muted: '#fdba74',
                glass: 'rgba(217, 119, 6, 0.1)',
                bodyBg: 'radial-gradient(1200px 600px at 10% 10%, rgba(217, 119, 6, 0.15), transparent), linear-gradient(180deg,#1c100b 0%, #451a03 100%)',
                textColor: '#fffbeb'
            },
            pink: {
                bg: '#1a050f',
                card: '#2e0a1a',
                accent: '#db2777',
                accent2: '#f472b6',
                muted: '#fbcfe8',
                glass: 'rgba(219, 39, 119, 0.1)',
                bodyBg: 'radial-gradient(1200px 600px at 10% 10%, rgba(219, 39, 119, 0.15), transparent), linear-gradient(180deg,#1a050f 0%, #500724 100%)',
                textColor: '#fce7f3'
            },
            midnight: {
                bg: '#020617',
                card: '#0f172a',
                accent: '#6366f1',
                accent2: '#818cf8',
                muted: '#cbd5e1',
                glass: 'rgba(99, 102, 241, 0.1)',
                bodyBg: 'radial-gradient(1200px 600px at 10% 10%, rgba(99, 102, 241, 0.15), transparent), linear-gradient(180deg,#020617 0%, #1e293b 100%)',
                textColor: '#f8fafc'
            }

        };

        function applyTheme(themeName) {
            const theme = themes[themeName];
            if (!theme) return;

            const root = document.documentElement;
            root.style.setProperty('--bg', theme.bg);
            root.style.setProperty('--card', theme.card);
            root.style.setProperty('--accent', theme.accent);
            root.style.setProperty('--accent2', theme.accent2);
            root.style.setProperty('--muted', theme.muted);
            root.style.setProperty('--glass', theme.glass);
            document.body.style.background = theme.bodyBg;
            document.body.style.color = theme.textColor;

            // Update active theme indicator
            document.querySelectorAll('.theme-option').forEach(opt => {
                opt.classList.remove('active');
                if (opt.dataset.theme === themeName) {
                    opt.classList.add('active');
                }
            });

            // Update particles color to match theme
            document.querySelectorAll('.particle').forEach(particle => {
                particle.style.background = theme.accent;
            });

            // Save to localStorage
            localStorage.setItem('reaxon-theme', themeName);
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('reaxon-theme') || 'dark';
        applyTheme(savedTheme);

        // Create particles after theme is applied
        const currentThemeColor = themes[savedTheme]?.accent || themes.dark.accent;
        createParticles(currentThemeColor);

        // Theme selector UI
        const themeBtn = document.getElementById('themeBtn');
        const themeDropdown = document.getElementById('themeDropdown');
        const themeOptions = document.querySelectorAll('.theme-option');

        themeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = themeDropdown.classList.contains('show');
            themeDropdown.classList.toggle('show');
            themeBtn.setAttribute('aria-expanded', !isOpen);
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!themeBtn.contains(e.target) && !themeDropdown.contains(e.target)) {
                themeDropdown.classList.remove('show');
                themeBtn.setAttribute('aria-expanded', 'false');
            }
        });

        // Theme option selection
        themeOptions.forEach(option => {
            option.addEventListener('click', () => {
                const themeName = option.dataset.theme;
                applyTheme(themeName);
                themeDropdown.classList.remove('show');
                themeBtn.setAttribute('aria-expanded', 'false');
            });
        });

        // Keyboard shortcuts
        window.addEventListener('keydown', (e) => {
            // Ctrl+K or Cmd+K to focus search
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                q.focus();
                q.select();
            }

            // T key to toggle theme selector
            if (e.key === 't' && !e.ctrlKey && !e.metaKey && !e.shiftKey && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                themeDropdown.classList.toggle('show');
                themeBtn.setAttribute('aria-expanded', themeDropdown.classList.contains('show'));
            }

            // Escape to close theme dropdown
            if (e.key === 'Escape' && themeDropdown.classList.contains('show')) {
                themeDropdown.classList.remove('show');
                themeBtn.setAttribute('aria-expanded', 'false');
            }

            // Arrow keys for suggestions navigation
            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                const suggestions = suggestionsEl.querySelectorAll('.sugg');
                if (suggestions.length > 0 && document.activeElement === q) {
                    e.preventDefault();
                    const currentIndex = Array.from(suggestions).findIndex(s => s === document.activeElement);
                    let nextIndex;
                    if (e.key === 'ArrowDown') {
                        nextIndex = currentIndex < 0 ? 0 : (currentIndex + 1) % suggestions.length;
                    } else {
                        nextIndex = currentIndex <= 0 ? suggestions.length - 1 : currentIndex - 1;
                    }
                    suggestions[nextIndex].focus();
                    suggestions[nextIndex].click();
                }
            }
        });

    </script>
</body>
